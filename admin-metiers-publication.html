<style>
:root{
  --gold:#d4af37;
  --gold-light:#f3e5ab;
  --black:#050505;
  --dark:#0b0e13;
  --soft-dark:#12161f;
  --white:#ffffff;
  --gray:#888888;
  --red:#dc2626;
  --green:#15803d;
}

*{ box-sizing:border-box; margin:0; padding:0; }
body{ min-height:100vh; background:var(--black); color:var(--white); font-family:'Poppins',sans-serif; padding:15px; }

.admin-card{
  max-width:680px;
  margin:20px auto;
  background:var(--soft-dark);
  border:1px solid var(--gold);
  border-radius:14px;
  padding:22px;
  box-shadow:0 8px 24px rgba(212,175,55,0.15);
}

.admin-header{
  text-align:center;
  margin-bottom:20px;
  border-bottom:1px solid rgba(212,175,55,0.3);
  padding-bottom:12px;
}

.admin-header h2{
  color:var(--gold);
  font-size:18px;
  font-weight:800;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.full-width{
  grid-column:1 / -1;
}

.form-group{
  margin-bottom:10px;
}

label{
  display:block;
  font-size:11px;
  color:var(--gold-light);
  margin-bottom:4px;
  font-weight:600;
}

input, select, textarea{
  width:100%;
  padding:10px 12px;
  border-radius:8px;
  border:1px solid rgba(212,175,55,0.3);
  background:#000;
  color:#fff;
  font-size:12px;
  outline:none;
}

input:focus, select:focus, textarea:focus{
  border-color:var(--gold);
}

/* SÉLECTEUR DE MÉTIERS AVEC RECHERCHE INSTANTANÉE */
.search-select { position: relative; width: 100%; }
.display {
  background: #000;
  border: 1px solid rgba(212,175,55,0.3);
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: #fff;
}
.display:hover { border-color: var(--gold); }
.display .arrow { font-size: 0.9rem; opacity: 0.7; color: var(--gold); }
.dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  left: 0; right: 0;
  background: #12161f;
  border: 1px solid var(--gold);
  border-radius: 8px;
  max-height: 320px;
  overflow: hidden;
  z-index: 100;
  box-shadow: 0 12px 30px rgba(0,0,0,0.8);
}
.dropdown.open { display: block; }
.search-box { padding: 10px; border-bottom: 1px solid rgba(212,175,55,0.2); background: #000; }
.search-box input {
  width: 100%;
  padding: 9px 12px;
  border-radius: 6px;
  border: 1px solid rgba(212,175,55,0.4);
  background: #000;
  color: #fff;
  font-size: 12px;
  outline: none;
}
.search-box input:focus { border-color: var(--gold); }
.options { max-height: 220px; overflow-y: auto; }
.option {
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  transition: background 0.12s;
  font-size: 11.5px;
  color: #e2e8f0;
}
.option:hover, .option.selected { background: #222b3d; color: var(--gold-light); }
.option.hidden { display: none; }
.no-result {
  padding: 15px;
  text-align: center;
  color: #94a3b8;
  display: none;
  font-size: 11px;
}
.count-text { font-size: 9.5px; color: var(--gray); margin-top: 3px; }

.preview-box {
  min-height: 180px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #0d0d11;
  border: 1px dashed rgba(212,175,55,0.4);
  border-radius: 8px;
  padding: 10px;
  gap: 10px;
  margin-top: 6px;
}
.preview-canvas { width: 100%; max-width: 280px; height: 160px; object-fit: cover; border-radius: 7px; background: #080b10; border: 1px solid var(--gold); display: none; }
.preview-video { width: 100%; max-width: 280px; height: 160px; object-fit: cover; border-radius: 7px; background: #000; border: 1px solid var(--gold); display: none; }

.btn-submit{
  width:100%;
  padding:14px;
  border:none;
  border-radius:24px;
  background:linear-gradient(135deg, var(--gold), #aa8c2c);
  color:#000;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  margin-top:15px;
  transition:transform 0.2s;
}

.btn-submit:active{ transform:scale(0.98); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

.status-msg{
  margin-top:12px;
  text-align:center;
  font-size:12px;
  font-weight:600;
}

@media(max-width:600px){
  .form-grid{ grid-template-columns:1fr; }
}
</style>
</head>

<div class="admin-card">
  <div class="admin-header">
    <h2>🛠️ Publication Administrateur — Profil Métier</h2>
    <p style="font-size:11px; color:#aaa;">Enregistrement des professionnels certifiés sur DAKPROÉLITE via Cloudinary</p>
  </div>

  <form id="publicationForm">
    <div class="form-grid">
      
      <div class="form-group full-width">
        <label>Nom du Professionnel / Raison Sociale *</label>
        <input type="text" id="nom" required placeholder="Ex: Garage Automobile Excellence">
      </div>

      <!-- SÉLECTEUR DE MÉTIERS AVEC RECHERCHE INSTANTANÉE -->
      <div class="form-group full-width">
        <label>Corps de Métier / Production *</label>
        <div class="search-select" id="metierSelect">
          <div class="display" id="display">
            <span id="displayText">Sélectionner un métier ou une production...</span>
            <span class="arrow">▼</span>
          </div>
          <div class="dropdown" id="dropdown">
            <div class="search-box">
              <input type="text" id="searchInput" placeholder="Rechercher (ex: anacarde, maçon, mécanicien...)" autocomplete="off">
            </div>
            <div class="options" id="optionsList"></div>
            <div class="no-result" id="noResult">Aucun résultat trouvé</div>
          </div>
        </div>
        <div class="count-text" id="countText"></div>
      </div>

      <div class="form-group">
        <label>Pays *</label>
        <input type="text" id="pays" required value="Bénin">
      </div>

      <div class="form-group">
        <label>Département / Région *</label>
        <input type="text" id="departement" required placeholder="Ex: Littoral, Ouémé, Borgou...">
      </div>

      <div class="form-group">
        <label>Ville / Adresse Complète *</label>
        <input type="text" id="ville" required placeholder="Ex: Cotonou, Akpakpa Rue 12">
      </div>

      <div class="form-group">
        <label>Numéro d'Appel Direct *</label>
        <input type="tel" id="telephone" required placeholder="+2290100000000">
      </div>

      <div class="form-group">
        <label>Numéro WhatsApp *</label>
        <input type="tel" id="whatsapp" required placeholder="+2290100000000">
      </div>

      <div class="form-group full-width">
        <label>Description Complète du Service / Prestation *</label>
        <textarea id="description" rows="4" required placeholder="Détaillez les compétences, l'expérience, la garantie des services..."></textarea>
      </div>

      <!-- SÉLECTEUR UNIVERSEL DE MÉDIAS AVEC APERÇU ET PROGRESSION -->
      <div class="form-group full-width">
        <label><i class="fa-solid fa-folder-open"></i> Fichier Multimédia (Image, Vidéo ou Document) *</label>
        <input type="file" id="adminUniversalFile" accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt" required>
        <small id="fileInfoLabel" style="color: var(--gold-light); font-size: 10px; margin-top: 4px; display:block;"></small>
        
        <div class="preview-box">
            <canvas id="imageCanvas" class="preview-canvas"></canvas>
            <video id="videoPreview" class="preview-video" controls playsinline></video>
            <div id="documentPreview" style="display:none; text-align:center;">
                <i class="fa-solid fa-file-lines" style="font-size:36px; color:var(--gold); margin-bottom:6px;"></i><br>
                <a id="documentLinkBtn" href="#" target="_blank" style="color:var(--gold); font-size:11px; text-decoration:underline;">📄 Document prêt</a>
            </div>
            <span id="previewText" style="color:var(--gray); font-size:11px; text-align:center;">Aperçu du média sélectionné...</span>
        </div>
      </div>

    </div>

    <button type="submit" class="btn-submit" id="btnSubmit">🚀 Publier le Profil Métier</button>
    <div class="status-msg" id="statusMessage"></div>
  </form>
</div>

// --- LOGIQUE DE RECHERCHE ET SÉLECTION INSTANTANÉE ---
const optionsList = document.getElementById('optionsList');
const display = document.getElementById('display');
const displayText = document.getElementById('displayText');
const dropdown = document.getElementById('dropdown');
const searchInput = document.getElementById('searchInput');
const noResult = document.getElementById('noResult');
const countText = document.getElementById('countText');

let selectedMetierValue = "";

countText.textContent = `${metiers.length} métiers & productions disponibles`;

// Génération de la liste initiale
metiers.forEach(metier => {
  const div = document.createElement('div');
  div.className = 'option';
  div.textContent = metier;
  div.dataset.value = metier;
  optionsList.appendChild(div);
});

// Ouvrir/Fermer le menu déroulant au clic
display.addEventListener('click', (e) => {
  e.stopPropagation();
  dropdown.classList.toggle('open');
  if (dropdown.classList.contains('open')) {
    searchInput.focus();
    searchInput.value = '';
    filterOptions('');
  }
});

// Fermer le menu si on clique en dehors
document.addEventListener('click', (e) => {
  if (!document.getElementById('metierSelect').contains(e.target)) {
    dropdown.classList.remove('open');
  }
});

// Filtrage en temps réel dès la saisie (ex: "mécanicien")
searchInput.addEventListener('input', (e) => {
  filterOptions(e.target.value.trim().toLowerCase());
});

function filterOptions(query) {
  const options = optionsList.querySelectorAll('.option');
  let visibleCount = 0;
  options.forEach(opt => {
    const text = opt.textContent.toLowerCase();
    if (text.includes(query)) {
      opt.classList.remove('hidden');
      visibleCount++;
    } else {
      opt.classList.add('hidden');
    }
  });
  noResult.style.display = visibleCount === 0 ? 'block' : 'none';
}

// Sélection d'un métier dans la liste
optionsList.addEventListener('click', (e) => {
  if (e.target.classList.contains('option')) {
    selectedMetierValue = e.target.dataset.value;
    displayText.textContent = selectedMetierValue;
    dropdown.classList.remove('open');

    optionsList.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
    e.target.classList.add('selected');
  }
});


// --- CONFIGURATION CLOUDINARY & PROGRESSION ---
function uploadToCloudinaryWithProgress(file, onProgress) {
  return new Promise((resolve, reject) => {
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    formData.append("folder", "dakproelite_metiers");

    const xhr = new XMLHttpRequest();
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, true);

    xhr.upload.onprogress = function(event) {
      if (event.lengthComputable) {
        const percentComplete = Math.round((event.loaded / event.total) * 100);
        if (onProgress) onProgress(percentComplete);
      }
    };

    xhr.onload = function() {
      try {
        const data = JSON.parse(xhr.responseText);
        if (xhr.status >= 200 && xhr.status < 300 && data.secure_url) {
          resolve(data.secure_url);
        } else {
          reject(new Error(data.error?.message || "Erreur lors de l'upload sur Cloudinary"));
        }
      } catch (e) {
        reject(new Error("Erreur de traitement de la réponse Cloudinary."));
      }
    };

    xhr.onerror = function() {
      reject(new Error("Erreur réseau lors du téléchargement vers Cloudinary."));
    };

    xhr.send(formData);
  });
}

// Gestion de l'aperçu du fichier sélectionné
const universalFileInput = document.getElementById("adminUniversalFile");
const fileInfoLabel = document.getElementById("fileInfoLabel");
const canvas = document.getElementById("imageCanvas");
const videoPreview = document.getElementById("videoPreview");
const documentPreview = document.getElementById("documentPreview");
const documentLinkBtn = document.getElementById("documentLinkBtn");
const previewText = document.getElementById("previewText");

let selectedFileObject = null;

universalFileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    selectedFileObject = file;
    const fileType = file.type;

    canvas.style.display = "none";
    videoPreview.style.display = "none";
    documentPreview.style.display = "none";
    previewText.style.display = "block";

    const tempLocalUrl = URL.createObjectURL(file);

    if (fileType.startsWith("image/")) {
        fileInfoLabel.textContent = `🖼️ Image sélectionnée : ${file.name}`;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const ctx = canvas.getContext("2d");
                canvas.width = 600;
                canvas.height = 400;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#080b10";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                let hRatio = canvas.width / img.width;
                let vRatio = canvas.height / img.height;
                let ratio = Math.max(hRatio, vRatio);
                let centerShiftX = (canvas.width - img.width * ratio) / 2;
                let centerShiftY = (canvas.height - img.height * ratio) / 2;
                
                ctx.drawImage(img, 0, 0, img.width, img.height, centerShiftX, centerShiftY, img.width * ratio, img.height * ratio);
                canvas.style.display = "block";
                previewText.style.display = "none";
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);

    } else if (fileType.startsWith("video/")) {
        fileInfoLabel.textContent = `🎥 Vidéo sélectionnée : ${file.name}`;
        videoPreview.src = tempLocalUrl;
        videoPreview.style.display = "block";
        previewText.style.display = "none";

    } else {
        fileInfoLabel.textContent = `📄 Document sélectionné : ${file.name}`;
        documentLinkBtn.href = tempLocalUrl;
        documentPreview.style.display = "block";
        previewText.style.display = "none";
    }
});

// Soumission du formulaire (Envoi Cloudinary d'abord, puis enregistrement Firebase)
document.getElementById("publicationForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btnSubmit");
  const status = document.getElementById("statusMessage");

  if (!selectedMetierValue) {
    alert("Veuillez sélectionner un corps de métier ou une production.");
    return;
  }

  if (!selectedFileObject) {
    alert("Veuillez sélectionner un fichier multimédia.");
    return;
  }

  btn.disabled = true;
  status.style.color = "var(--gold)";
  status.textContent = "⏳ Initialisation de l'envoi sur Cloudinary (0%)...";

  try {
    const finalFileUrl = await uploadToCloudinaryWithProgress(selectedFileObject, (percent) => {
      status.textContent = `⏳ Téléchargement vers Cloudinary en cours : ${percent}%`;
      btn.textContent = `⏳ Envoi ${percent}%`;
    });

    let uploadedImageUrl = "";
    let uploadedVideoUrl = "";
    let uploadedDocumentUrl = "";

    const fileType = selectedFileObject.type;
    if (fileType.startsWith("image/")) {
        uploadedImageUrl = finalFileUrl;
    } else if (fileType.startsWith("video/")) {
        uploadedVideoUrl = finalFileUrl;
    } else {
        uploadedDocumentUrl = finalFileUrl;
    }

    status.textContent = "⏳ Enregistrement des données dans Realtime Database...";
    btn.textContent = "⏳ Enregistrement...";

    const newRef = push(ref(db, "metiers_publications"));
    const idMetier = newRef.key;

    const payload = {
      id: idMetier,
      nom: document.getElementById("nom").value.trim(),
      categorie: selectedMetierValue,
      pays: document.getElementById("pays").value.trim(),
      departement: document.getElementById("departement").value.trim(),
      ville: document.getElementById("ville").value.trim(),
      telephone: document.getElementById("telephone").value.trim(),
      whatsapp: document.getElementById("whatsapp").value.trim(),
      description: document.getElementById("description").value.trim(),
      image: uploadedImageUrl || "https://i.postimg.cc/WpSc29mX/file-00000000ca8872438c17222eb828bc0c.png",
      images: uploadedImageUrl ? [uploadedImageUrl] : [],
      video: uploadedVideoUrl || "",
      document: uploadedDocumentUrl || "",
      actif: true,
      createdAt: Date.now()
    };

    await set(newRef, payload);

    status.style.color = "var(--green)";
    status.textContent = "✅ Fichier envoyé sur Cloudinary et données enregistrées avec succès !";
    alert("🎉 Profil métier publié avec succès !");

    document.getElementById("publicationForm").reset();
    displayText.textContent = "Sélectionner un métier ou une production...";
    selectedMetierValue = "";
    document.getElementById("fileInfoLabel").textContent = "";
    canvas.style.display = "none";
    videoPreview.style.display = "none";
    documentPreview.style.display = "none";
    previewText.style.display = "block";
    previewText.textContent = "Aperçu du média sélectionné...";
    selectedFileObject = null;

  } catch (error) {
    console.error("Erreur de publication:", error);
    status.style.color = "var(--red)";
    status.textContent = "❌ Erreur : " + error.message;
    alert("❌ Une erreur est survenue : " + error.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "🚀 Publier le Profil Métier";
  }
});
</script>

<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAKPRO ÉLITE | Compte & Inscription</title>
    <!-- Configuration PWA & SEO -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4af37">
    
    <!-- Icônes & Font -->
    <link rel="icon" type="image/png" href="https://i.postimg.cc/WpSc29mX/file-00000000ca8872438c17222eb828bc0c.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --gold: #d4af37; 
            --gold-light: #f3e5ab;
            --dark: #0b0c10; 
            --soft-dark: #141922; 
            --card-bg: #1f2833;
            --blue-accent: #00b4d8;
            --blue-hover: #0077b6;
            --danger: #ff4d4d;
            --text-main: #c5c6c7;
            --text-white: #ffffff;
        }
        
        body { 
            margin: 0; 
            font-family: 'Poppins', sans-serif; 
            background: var(--dark); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
            box-sizing: border-box;
        }
        
        .auth-container {
            background: var(--soft-dark); 
            border: 2px solid var(--gold); 
            border-radius: 20px;
            padding: 35px 25px; 
            width: 100%; 
            max-width: 450px; 
            box-sizing: border-box;
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.2); 
            text-align: center;
        }

        /* Logo agrandi et stylisé */
        .auth-logo {
            width: 100px; 
            height: 100px; 
            border-radius: 50%; 
            border: 3px solid var(--gold);
            object-fit: cover; 
            margin-bottom: 20px; 
            background: #000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .auth-container h2 { 
            color: var(--gold); 
            margin-top: 0; 
            font-size: 24px; 
            font-weight: 600;
            margin-bottom: 8px; 
        }
        
        .auth-subtitle { 
            font-size: 13px; 
            color: var(--text-main); 
            margin-bottom: 25px; 
            line-height: 1.5; 
        }

        .form-group { 
            margin-bottom: 18px; 
            text-align: left; 
        }
        
        .form-group label { 
            display: block; 
            color: var(--text-white); 
            font-size: 13px; 
            font-weight: 500;
            margin-bottom: 6px; 
        }
        
        .form-group input, .form-group select {
            width: 100%; 
            padding: 12px 15px; 
            background: #000000; 
            border: 1px solid rgba(0, 180, 216, 0.5);
            color: #fff; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-family: 'Poppins', sans-serif; 
            outline: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus, .form-group select:focus { 
            border-color: var(--gold); 
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .password-wrapper input {
            padding-right: 45px;
        }
        
        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--blue-accent);
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s;
        }
        
        .toggle-password:hover {
            color: var(--gold);
        }

        .forgot-password-container {
            text-align: right;
            margin-top: 6px;
        }
        
        .forgot-password {
            font-size: 12px;
            color: var(--blue-accent);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .forgot-password:hover {
            color: var(--gold);
            text-decoration: underline;
        }

        .btn { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            background: linear-gradient(135deg, var(--gold), #b38f27); 
            color: #000; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 15px; 
            transition: transform 0.2s, opacity 0.2s; 
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        
        .btn:hover { 
            opacity: 0.95; 
            transform: translateY(-1px);
        }

        .toggle-auth { 
            margin-top: 20px; 
            font-size: 13px; 
            color: var(--text-main); 
        }
        
        .toggle-auth span { 
            color: var(--gold); 
            cursor: pointer; 
            font-weight: 600; 
            text-decoration: underline; 
        }
    </style>
</head>
<body>

<div class="auth-container">
    <img src="https://i.postimg.cc/WpSc29mX/file-00000000ca8872438c17222eb828bc0c.png" alt="Logo DAKPRO" class="auth-logo">
    <h2 id="formTitle">Connexion à DAKPRO ÉLITE</h2>
    <p id="formSubtitle" class="auth-subtitle">Bienvenue sur le marché international d'achat, de vente et de dropshipping. Accédez à votre espace sécurisé.</p>

    <!-- Formulaire global relié à votre script externe -->
    <form id="authForm" onsubmit="event.preventDefault(); gererAuthentification();">
        
        <!-- Champ Nom complet (Visible uniquement en mode Inscription) -->
        <div class="form-group" id="nameGroup" style="display: none;">
            <label for="nomInput">Nom complet</label>
            <input type="text" id="nomInput" placeholder="Ex: DAK JUBILE">
        </div>

        <div class="form-group">
            <label for="emailInput">Adresse Email</label>
            <input type="email" id="emailInput" placeholder="votre@email.com" required>
        </div>

        <div class="form-group">
            <label for="passwordInput">Mot de passe</label>
            <div class="password-wrapper">
                <input type="password" id="passwordInput" placeholder="••••••••" required>
                <button type="button" class="toggle-password" onclick="basculerVisibilite('passwordInput', this)" title="Afficher / Masquer">👁️</button>
            </div>
            <div class="forgot-password-container" id="forgotPasswordContainer">
                <span class="forgot-password" onclick="reinitialiserMotDePasse()">Mot de passe oublié ?</span>
            </div>
        </div>

        <!-- Champ de confirmation du mot de passe (Visible uniquement en mode Inscription) -->
        <div class="form-group" id="confirmPasswordGroup" style="display: none;">
            <label for="confirmPasswordInput">Confirmer le mot de passe</label>
            <div class="password-wrapper">
                <input type="password" id="confirmPasswordInput" placeholder="••••••••">
                <button type="button" class="toggle-password" onclick="basculerVisibilite('confirmPasswordInput', this)" title="Afficher / Masquer">👁️</button>
            </div>
        </div>

        <!-- Choix du rôle (Visible uniquement en mode Inscription) -->
        <div class="form-group" id="roleGroup" style="display: none;">
            <label for="roleSelect">Je souhaite m'inscrire en tant que :</label>
            <select id="roleSelect">
                <option value="acheteur">🛒 Acheteur / Client</option>
                <option value="vendeur">💼 Vendeur / E-commerçant</option>
            </select>
        </div>

        <button type="submit" class="btn" id="submitBtn">Se Connecter</button>
    </form>

    <div class="toggle-auth">
        <p id="toggleText">Pas encore de compte ? <span onclick="basculerMode()">S'inscrire</span></p>
    </div>
</div>

<!-- Script de gestion dynamique de l'interface -->
<script>
    let estEnModeInscription = false;

    function basculerMode() {
        estEnModeInscription = !estEnModeInscription;
        
        const formTitle = document.getElementById("formTitle");
        const formSubtitle = document.getElementById("formSubtitle");
        const nameGroup = document.getElementById("nameGroup");
        const confirmPasswordGroup = document.getElementById("confirmPasswordGroup");
        const roleGroup = document.getElementById("roleGroup");
        const forgotPasswordContainer = document.getElementById("forgotPasswordContainer");
        const submitBtn = document.getElementById("submitBtn");
        const toggleText = document.getElementById("toggleText");

        if (estEnModeInscription) {
            formTitle.innerText = "Créer un compte DAKPRO ÉLITE";
            formSubtitle.innerText = "Rejoignez notre réseau international et commencez à acheter ou vendre en toute sécurité.";
            nameGroup.style.display = "block";
            confirmPasswordGroup.style.display = "block";
            roleGroup.style.display = "block";
            forgotPasswordContainer.style.display = "none";
            submitBtn.innerText = "S'inscrire";
            toggleText.innerHTML = `Déjà un compte ? <span onclick="basculerMode()">Se connecter</span>`;
        } else {
            formTitle.innerText = "Connexion à DAKPRO ÉLITE";
            formSubtitle.innerText = "Bienvenue sur le marché international d'achat, de vente et de dropshipping. Accédez à votre espace sécurisé.";
            nameGroup.style.display = "none";
            confirmPasswordGroup.style.display = "none";
            roleGroup.style.display = "none";
            forgotPasswordContainer.style.display = "block";
            submitBtn.innerText = "Se Connecter";
            toggleText.innerHTML = `Pas encore de compte ? <span onclick="basculerMode()">S'inscrire</span>`;
        }
    }

    function basculerVisibilite(idChamp, bouton) {
        const champ = document.getElementById(idChamp);
        if (champ.type === "password") {
            champ.type = "text";
            bouton.innerText = "🙈";
        } else {
            champ.type = "password";
            bouton.innerText = "👁️";
        }
    }
</script>

<!-- Liaison avec votre fichier JavaScript externe (connexion.js) -->
<script type="module" src="connexion.js"></script>

</body>
</html>
